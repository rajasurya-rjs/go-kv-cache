# Cluster-internal Service exposing the cache on port 7171.
# Other workloads reach it at http://kv-cache.<namespace>.svc:7171
apiVersion: v1
kind: Service
metadata:
  name: kv-cache
  labels:
    app: kv-cache
spec:
  type: ClusterIP
  selector:
    app: kv-cache
  ports:
    - name: http
      port: 7171
      targetPort: http
      protocol: TCP
