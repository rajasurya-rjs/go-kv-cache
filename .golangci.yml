# golangci-lint v2 configuration.
# `standard` = errcheck, govet, ineffassign, staticcheck, unused.
# The extra linters below catch security issues, error-wrapping mistakes and
# common style problems before review.
version: "2"

linters:
  default: standard
  enable:
    - gosec        # security (also run standalone in CI)
    - errorlint    # correct use of errors.Is / errors.As / %w
    - bodyclose    # HTTP response bodies are closed
    - misspell     # typos in comments and strings
    - unconvert    # redundant type conversions
    - gocritic     # assorted correctness and style checks
    - revive       # successor to golint
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-return
  exclusions:
    rules:
      # Tests and benchmarks may use weak randomness and unchecked conversions.
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports

run:
  timeout: 5m
